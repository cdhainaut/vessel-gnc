[build-system]
requires = ["scikit-build-core>=0.10", "cmake>=3.20", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "vessel-gnc"
version = "0.4.0"
description = "Compact C++/Python simulation and control stack for autonomous surface vessels"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Charles Dhainaut" }]
keywords = ["marine", "simulation", "control", "state-estimation", "nmpc", "cpp", "pybind11"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10",  # GIF writer for the animations
    "casadi>=3.6",  # NMPC (python/vessel_gnc/nmpc.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.20"
cmake.args = ["-DBUILD_TESTING=OFF"]
wheel.packages = ["python/vessel_gnc"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
