    <line x1="0" y1="0" x2="52" y2="0" stroke="#14213d" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Prediction horizon dots -->
  <circle cx="505" cy="88" r="5" fill="#3b83c5"/>
  <circle cx="545" cy="98" r="5" fill="#3b83c5" opacity="0.65"/>
  <circle cx="585" cy="103" r="5" fill="#3b83c5" opacity="0.35"/>
  <!-- Wordmark -->
  <text x="30" y="52" font-size="58" font-weight="700" letter-spacing="1" fill="#14213d">Vessel-GNC</text>
  <text x="30" y="92" font-size="22" letter-spacing="4.5" fill="#5b6b7f">SIMULATE · ESTIMATE · CONTROL</text>
</svg>
