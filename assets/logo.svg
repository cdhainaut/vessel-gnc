<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" width="820" height="210" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <!-- Reference path (the S-curve of the flagship scenario) and its horizon -->
