<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <!-- Reference -->
  <rect x="60" y="90" width="180" height="64" rx="8" fill="#edf2f7" stroke="#718096" stroke-width="1.5"/>
  <text x="150" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Reference path</text>
  <text x="150" y="136" text-anchor="middle" font-size="12" fill="#4a5568">waypoints · mission clock</text>

  <!-- NMPC -->
  <rect x="420" y="90" width="230" height="64" rx="8" fill="#eaf3ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="535" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">NMPC</text>
  <text x="535" y="136" text-anchor="middle" font-size="12" fill="#2b6cb0">CasADi · IPOPT · 5 Hz</text>

  <!-- Vessel (C++ core) -->
  <rect x="730" y="90" width="200" height="64" rx="8" fill="#fff4e6" stroke="#c05621" stroke-width="1.5"/>
  <text x="830" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">Vessel 3-DOF</text>
  <text x="830" y="136" text-anchor="middle" font-size="12" fill="#c05621">dynamics · RK4 · C++20</text>

  <!-- EKF -->
  <rect x="420" y="330" width="230" height="64" rx="8" fill="#eaf3ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="535" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">EKF</text>
  <text x="535" y="376" text-anchor="middle" font-size="12" fill="#2b6cb0">GNSS · compass · speed · gyro</text>

  <!-- Arrows: reference -> NMPC -->
  <line x1="240" y1="122" x2="414" y2="122" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="327" y="110" text-anchor="middle" font-size="12" fill="#4a5568">path</text>

  <!-- Arrows: NMPC -> vessel -->
  <line x1="650" y1="122" x2="724" y2="122" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="687" y="110" text-anchor="middle" font-size="12" fill="#4a5568">τ = [T, N]</text>

  <!-- Arrows: vessel -> sensors -> EKF -->
  <path d="M 830 154 L 830 260 L 650 260 L 650 324" fill="none" stroke="#4a5568"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="752" y="250" text-anchor="middle" font-size="12" fill="#4a5568">noisy measurements</text>

  <!-- Arrows: EKF -> NMPC (estimate feedback) -->
  <line x1="535" y1="330" x2="535" y2="160" stroke="#2b6cb0" stroke-width="1.5"
        marker-end="url(#arrow-blue)"/>
  <text x="547" y="248" font-size="12" fill="#2b6cb0">x̂</text>

  <!-- Disturbances -->
  <line x1="960" y1="60" x2="934" y2="84" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="905" y="52" text-anchor="end" font-size="12" fill="#4a5568">current · wind</text>

  <!-- Legend -->
  <rect x="60" y="410" width="18" height="14" rx="3" fill="#eaf3ff" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="86" y="421" font-size="12" fill="#1a202c">Python — guidance · estimation · optimization · orchestration</text>
  <rect x="60" y="440" width="18" height="14" rx="3" fill="#fff4e6" stroke="#c05621" stroke-width="1.2"/>
  <text x="86" y="451" font-size="12" fill="#1a202c">C++20 core — performance-critical physics and numerics</text>
</svg>
